<ion-content [fullscreen]="true">
  <div class="page-container">
    <app-header [eyebrow]="eyebrow" [headerText]="headerText" />

    <app-hero-card [mostRecentNight]="sleepService.getMostRecentNight()" />

    <div class="action-button-container">
      <app-action-button
        icon="moon-outline"
        title="Log Sleep"
        subtitle="Add Entry"
        tone="night"
        (pressed)="onLogSleep()"
      />
      <app-action-button
        icon="sunny-outline"
        title="Sleepiness"
        subtitle="Check In"
        tone="sun"
        (pressed)="onCheckIn()"
      />
    </div>

    <app-recent-logs
      eyebrow="YOUR RHYTHM"
      headerText="Recent Logs"
      [(selectedTab)]="selectedTab"
      [averageValue]="averageValue"
    />
  </div>

  <ion-modal
    #logSleepModal
    [isOpen]="isLogSleepOpen"
    [breakpoints]="[0, 0.37, 1]"
    [initialBreakpoint]="0.37"
    (didDismiss)="onLogSleepDismiss()"
  >
    <ng-template>
      <app-sleep-sheet
        class="ion-page"
        (saved)="logSleepModal.dismiss()"
        (closed)="logSleepModal.dismiss()"
      />
    </ng-template>
  </ion-modal>

  <ion-modal
    #checkInModal
    [isOpen]="isCheckInOpen"
    [breakpoints]="[0, 0.80, 1]"
    [initialBreakpoint]="0.80"
    (didDismiss)="onCheckInDismiss($event)"
  >
    <ng-template>
      <app-sleepiness-sheet
        class="ion-page"
        (saved)="checkInModal.dismiss()"
        (closed)="checkInModal.dismiss()"
      />
    </ng-template>
  </ion-modal>
</ion-content>
