<div class="recent-logs-container">
  <div class="recent-logs-section-header">
    <div class="header-title">
      <p class="header-eyebrow">{{ eyebrow }}</p>
      <h2 class="header-text">{{ headerText }}</h2>
    </div>

    <div class="average-sleep">
      <p>{{ averageValue }} <span> avg.</span></p>
    </div>
  </div>

  <ion-segment [value]="selectedTab" (ionChange)="onSegmentChange($event)">
    <ion-segment-button value="overnight">
      <div>
        <ion-icon name="moon-outline" aria-hidden="true" />
        <ion-label>Overnight</ion-label>
      </div>
    </ion-segment-button>
    <ion-segment-button value="daytime">
      <div>
        <ion-icon name="sunny-outline" aria-hidden="true" />
        <ion-label>Daytime</ion-label>
      </div>
    </ion-segment-button>
  </ion-segment>

  @if (selectedTab === "overnight") {
    <app-recent-logs-overnight-week-chart
      [nights]="sleepService.getLastNNights(7)"
    />

    <ion-card>
      <ion-list lines="full" class="night-list">
        @for (night of recentNights; track night.id) {
          <ion-item button (click)="onNightSelected(night)">
            <app-night-row [night]="night" />
          </ion-item>
        } @empty {
          <ion-item class="empty-night-list"
            >No nights logged in the last 7 days.</ion-item
          >
        }
      </ion-list>
    </ion-card>
  } @else {}
</div>
